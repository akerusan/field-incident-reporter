openapi: 3.1.0
info:
  title: Field Incident Reporter API
  version: 1.0.0
  description: |
    The contract between the Android app, the operator dashboard and the mock server.

    **Writes from the app are idempotent.** Incidents get their id on the device (a UUID), so they
    can be created offline. The app creates *and* updates with `PUT /incidents/{id}`, and retries
    the same request after a network failure without risking duplicates.

    **Status ownership.** Technicians report and edit incidents (status `OPEN` or `IN_PROGRESS`).
    Operators triage them from the dashboard with `PATCH` and are the only ones who set
    `RESOLVED`. Once resolved, an incident can't be overwritten or deleted by the app (`409`);
    an operator can reopen it.

    **Timestamps** are ISO-8601 UTC instants set by the client. The server stores what it
    receives; concurrent writes are last-write-wins, except for the `RESOLVED` rule above.

    **Photos** are uploaded first (`POST /uploads`), then referenced from the incident by the
    returned relative path. Clients resolve that path against their own base URL.
# Authentication is out of scope for this local prototype.
security: []

servers:
  - url: http://localhost:3000
    description: Local mock server (from the Android emulator, use http://10.0.2.2:3000)

tags:
  - name: Incidents
    description: Incidents reported by technicians and triaged by operators.
  - name: Uploads
    description: Photo storage for incident attachments.

paths:
  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      operationId: listIncidents
      parameters:
        - name: _sort
          in: query
          description: Field to sort by.
          schema: { type: string, enum: [reportedAt, updatedAt, severity, status] }
        - name: _order
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IncidentStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/IncidentSeverity' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/IncidentCategory' }
      responses:
        '200':
          description: The incidents, filtered and sorted as requested.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }

  /incidents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Client-generated UUID.
        schema: { type: string, format: uuid }
    get:
      tags: [Incidents]
      summary: Get one incident
      operationId: getIncident
      responses:
        '200':
          description: The incident.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404':
          description: No incident with this id.
    put:
      tags: [Incidents]
      summary: Create or replace an incident (idempotent upsert)
      description: |
        Creates the incident if the id is new (`201`), otherwise replaces it (`200`). Sending the
        same request again has no further effect, so clients can retry safely. The id in the
        body, if any, is ignored in favour of the path.
      operationId: putIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInput' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/IncidentResolved'
    patch:
      tags: [Incidents]
      summary: Triage an incident (operator)
      description: Changes the status. Allowed on resolved incidents, so an operator can reopen one.
      operationId: patchIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentPatch' }
      responses:
        '200':
          description: The updated incident.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: No incident with this id.
    delete:
      tags: [Incidents]
      summary: Delete an incident
      description: |
        A `404` means the incident is already gone; the app treats it as success, which makes
        retried deletes safe.
      operationId: deleteIncident
      responses:
        '200':
          description: Deleted.
        '404':
          description: Already deleted, or never existed.
        '409':
          $ref: '#/components/responses/IncidentResolved'

  /uploads:
    post:
      tags: [Uploads]
      summary: Upload a photo
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: One JPEG, PNG or WebP image, at most 10 MB.
      responses:
        '201':
          description: Stored. Reference `path` from an incident's `photos`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '400':
          description: Missing file or unsupported type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: File larger than 10 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    IncidentCategory:
      type: string
      enum: [EQUIPMENT, ROAD_HAZARD, ELECTRICAL, PLUMBING, SAFETY, OTHER]
    IncidentSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    IncidentStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED]
      description: Technicians set OPEN or IN_PROGRESS; only operators set RESOLVED.

    Photo:
      type: object
      required: [id, path]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated id, stable across edits.
        path:
          type: string
          description: Relative path returned by `POST /uploads`, for example `/uploads/3f2a….jpg`.
          examples: ['/uploads/3f2a8c1e-5b7d-4e2a-9c1f-0d3e5a7b9c21.jpg']

    IncidentInput:
      type: object
      required: [title, description, category, severity, status, locationNote, photos, reportedAt, updatedAt]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category: { $ref: '#/components/schemas/IncidentCategory' }
        severity: { $ref: '#/components/schemas/IncidentSeverity' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        locationNote:
          type: string
          description: Free-text location, for example "Pump room B, building 3".
        photos:
          type: array
          description: In display order.
          items: { $ref: '#/components/schemas/Photo' }
        reportedAt:
          type: string
          format: date-time
          description: When the technician created the report (client clock, UTC).
        updatedAt:
          type: string
          format: date-time
          description: When the incident was last changed (client clock, UTC).

    Incident:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        - $ref: '#/components/schemas/IncidentInput'

    IncidentPatch:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus' }
        updatedAt:
          type: string
          format: date-time

    UploadResult:
      type: object
      required: [path]
      properties:
        path:
          type: string
          examples: ['/uploads/3f2a8c1e-5b7d-4e2a-9c1f-0d3e5a7b9c21.jpg']

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable code.
          enum: [VALIDATION_ERROR, INCIDENT_RESOLVED, METHOD_NOT_ALLOWED, INVALID_UPLOAD, FILE_TOO_LARGE, SIMULATED_FAILURE]
        message:
          type: string
          description: Human-readable explanation; not meant to be shown to end users as-is.

  responses:
    ValidationError:
      description: The body doesn't match the schema.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: VALIDATION_ERROR, message: title is required }
    IncidentResolved:
      description: The incident was resolved by an operator and can no longer be changed by the app.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INCIDENT_RESOLVED, message: This incident was resolved by an operator and can no longer be changed. }
