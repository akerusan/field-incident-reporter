version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    ignore:
      # Pinned on purpose: json-server 1.x is a rewrite (still beta) with a different API.
      - dependency-name: json-server
        update-types: ["version-update:semver-major"]
