name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", "server/openapi.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "server/openapi.yaml", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The committed API types must match the contract they are generated from.
      - name: API types are up to date with server/openapi.yaml
        run: npm run generate:api && git diff --exit-code -- src/api/types.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
